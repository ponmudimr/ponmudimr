  <rect x="68" y="462" width="364" height="36" fill="url(#dot-grid-hills)"/>
  <g clip-path="url(#matrix-clip-hills)">
    <g>
      <text x="380" y="485" font-family="Courier, monospace" font-size="14" font-weight="bold" letter-spacing="2.5" fill="#FF4D4D" filter="drop-shadow(0px 0px 3px #FF4D4D)">
        🚨 EMERGENCY ALERT: MISSING PERSON SOS BEACON LOCATED IN HILL SECTOR (ELEV 850m) • LORA SIGNAL STRENGTH: -84 dBm • SAR MOUNTAIN RESCUE DISPATCHED •
      </text>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-920 0" dur="11.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Handle Badge Pill -->
  <rect x="62" y="516" width="376" height="26" rx="13" fill="#0D1117" stroke="#00FF9D" stroke-width="1"/>
  <text x="250" y="533" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#00FF9D">@ponmudimr / TribalNet Hill Topo Radar</text>

