  <text x="516" y="144" font-family="monospace" font-size="10" fill="#E6EDF3">LORA: 433.00 MHz  |  HILL ELEV: 1120m MAX  |  SOS BEACON: ACTIVE  |  SAR: DISPATCHED</text>

