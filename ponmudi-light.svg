        🚨 EMERGENCY ALERT: MISSING PERSON SOS BEACON LOCATED IN HILL SECTOR (ELEV 850m) • LORA SIGNAL STRENGTH: -84 dBm • SAR MOUNTAIN RESCUE DISPATCHED •
