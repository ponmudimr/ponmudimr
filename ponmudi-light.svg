    <text x="609.4" y="465" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="465" text-anchor="end" fill="#0F172A">RF/SDR, LoRa Mesh, LEO-PNT, SAR Systems</text>

    <!-- Row 12 -->
