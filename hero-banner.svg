<svg viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="1"/>
    </linearGradient>
    <pattern id="waterfallGrid" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 20 L40 20" stroke="#1F6FEB" stroke-width="0.5" opacity="0.2"/>
      <path d="M0 0 L0 20" stroke="#1F6FEB" stroke-width="0.4" opacity="0.12"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 20" dur="1.2s" repeatCount="indefinite"/>
    </pattern>
    <pattern id="vias" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#8B949E"/>
    </pattern>
    <clipPath id="waterfallClip"><rect x="480" y="30" width="304" height="160"/></clipPath>
  </defs>

  <!-- BACKGROUND -->
  <rect width="800" height="250" fill="#0D1117"/>
  <rect x="0" y="0" width="470" height="250" fill="url(#vias)" opacity="0.5"/>
  <rect x="470" y="30" width="320" height="160" fill="url(#waterfallGrid)" clip-path="url(#waterfallClip)"/>
  <rect x="470" y="30" width="320" height="160" fill="url(#fadeBottom)" opacity="0.25" clip-path="url(#waterfallClip)"/>

  <!-- FRAME -->
  <rect x="4" y="4" width="792" height="242" fill="none" stroke="#8B949E" stroke-width="1" opacity="0.35"/>
  <text x="16" y="20" font-family="monospace" font-size="11" fill="#8B949E">TEAM_404 :: TRIBALNET / LEO-PNT STACK</text>
  <circle cx="778" cy="15" r="4" fill="#3FB950">
    <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- ================= PCB + CHIP (LEFT) ================= -->
  <g transform="translate(160,95)">
    <rect id="chip" width="80" height="60" fill="#0D1117" stroke="#8B949E" stroke-width="1.5"/>
    <text x="40" y="24" text-anchor="middle" font-family="monospace" font-size="9" fill="#8B949E">ESP32</text>
    <text x="40" y="38" text-anchor="middle" font-family="monospace" font-size="9" fill="#8B949E">SX1278</text>
    <g stroke="#8B949E" stroke-width="1">
      <line x1="-8" y1="10" x2="0" y2="10"/><line x1="-8" y1="25" x2="0" y2="25"/><line x1="-8" y1="40" x2="0" y2="40"/><line x1="-8" y1="50" x2="0" y2="50"/>
      <line x1="80" y1="10" x2="88" y2="10"/><line x1="80" y1="25" x2="88" y2="25"/><line x1="80" y1="40" x2="88" y2="40"/><line x1="80" y1="50" x2="88" y2="50"/>
    </g>
    <rect width="80" height="60" fill="#3FB950" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="0;0;0.18;0.18;0" keyTimes="0;0.24;0.3;0.5;1" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- self-routing copper traces into chip -->
  <g fill="none" stroke="#F85149" stroke-width="2.2" stroke-linecap="square">
    <path d="M20,60 L120,60 L120,105 L152,105" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0;0.2;0.9;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M20,120 L90,120 L90,120 L152,120" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;1;0;0;1" keyTimes="0;0.06;0.24;0.9;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M20,190 L150,190 L150,150 L152,150" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;1;0;0;1" keyTimes="0;0.1;0.27;0.9;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M440,60 L340,60 L340,115 L248,115" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;1;0;0;1" keyTimes="0;0.08;0.26;0.9;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M440,200 L300,200 L300,145 L248,145" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;1;0;0;1" keyTimes="0;0.12;0.28;0.9;1" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#F85149">
    <circle cx="20" cy="60" r="3"/><circle cx="20" cy="120" r="3"/><circle cx="20" cy="190" r="3"/>
    <circle cx="440" cy="60" r="3"/><circle cx="440" cy="200" r="3"/>
  </g>

  <!-- ================= LoRa PULSE (travels center -> right, into waterfall) ================= -->
  <g transform="translate(200,125)">
    <circle r="0" fill="none" stroke="#58A6FF" stroke-width="2">
      <animate attributeName="r" values="0;0;620" keyTimes="0;0.3;0.75" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.9;0" keyTimes="0;0.3;0.75" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="0" fill="none" stroke="#1F6FEB" stroke-width="1.5">
      <animate attributeName="r" values="0;0;500" keyTimes="0;0.34;0.75" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.6;0" keyTimes="0;0.34;0.75" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= DOPPLER WATERFALL (RIGHT) ================= -->
  <g clip-path="url(#waterfallClip)">
    <text x="490" y="46" font-family="monospace" font-size="10" fill="#8B949E">ORBCOMM // 137.1-137.9MHz</text>

    <!-- pre-lock: noisy/static signal -->
    <path fill="none" stroke="#F85149" stroke-width="1.5">
      <animate attributeName="opacity" values="0.85;0.85;0;0;0.85" keyTimes="0;0.35;0.42;0.95;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="d" dur="0.9s" repeatCount="indefinite"
        values="
          M490,120 L510,90 L530,150 L550,95 L570,140 L590,100 L610,135 L630,110 L650,150 L670,120 L690,120 L710,120 L730,120 L750,120 L770,120;
          M490,120 L510,145 L530,95 L550,140 L570,100 L590,145 L610,105 L630,140 L650,110 L670,130 L690,120 L710,120 L730,120 L750,120 L770,120;
          M490,120 L510,90 L530,150 L550,95 L570,140 L590,100 L610,135 L630,110 L650,150 L670,120 L690,120 L710,120 L730,120 L750,120 L770,120"/>
    </path>

    <!-- post-lock: clean doppler-warped sine -->
    <path stroke="#58A6FF" stroke-width="2" fill="none" filter="url(#glow)">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.42;0.95;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="d" dur="4s" repeatCount="indefinite"
        values="
          M490,120 C550,120 590,70 630,70 C670,70 700,120 770,120;
          M490,120 C550,120 600,50 630,55 C660,60 700,120 770,120;
          M490,120 C550,120 620,160 630,170 C640,160 700,120 770,120;
          M490,120 C550,120 590,70 630,70 C670,70 700,120 770,120"/>
    </path>
    <path stroke="#1F6FEB" stroke-width="1" fill="none" opacity="0.35">
      <animate attributeName="opacity" values="0;0;0.35;0.35;0" keyTimes="0;0.35;0.42;0.95;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="d" dur="4s" repeatCount="indefinite"
        values="
          M490,135 C550,135 590,85 630,85 C670,85 700,135 770,135;
          M490,135 C550,135 600,65 630,70 C660,75 700,135 770,135;
          M490,135 C550,135 620,175 630,185 C640,175 700,135 770,135;
          M490,135 C550,135 590,85 630,85 C670,85 700,135 770,135"/>
    </path>

    <!-- YOLO-style lock box on peak -->
    <g filter="url(#glow)">
      <rect width="60" height="42" fill="none" stroke="#3FB950" stroke-width="1.5">
        <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.35;0.4;0.45;0.9;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="x" dur="4s" repeatCount="indefinite" values="600;605;595;600"/>
        <animate attributeName="y" dur="4s" repeatCount="indefinite" values="50;35;150;50"/>
      </rect>
    </g>
  </g>

  <!-- terminal readout, synced to lock event -->
  <text x="16" y="235" font-family="monospace" font-size="12" fill="#8B949E">
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.2;0.24" dur="8s" repeatCount="indefinite"/>
    &gt; routing traces... autorouter online
  </text>
  <text x="16" y="235" font-family="monospace" font-size="12" fill="#58A6FF">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.26;0.34;0.38" dur="8s" repeatCount="indefinite"/>
    &gt; ESP32/SX1278 ONLINE :: EMITTING LORA PULSE
  </text>
  <text x="16" y="235" font-family="monospace" font-size="12" fill="#3FB950">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.45;0.9;0.95" dur="8s" repeatCount="indefinite"/>
    [TARGET: ORBCOMM // DOPPLER LOCK // POS COMPUTED]
  </text>
</svg>
