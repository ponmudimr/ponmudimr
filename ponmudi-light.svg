    <text x="557.6" y="222" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="222" text-anchor="end" fill="#0F172A">RF / SDR + Embedded Systems Engineer</text>

    <!-- Row 3: Flagship Project -->
    <text x="516" y="249" fill="#94A3B8">Project</text>
    <text x="579.8" y="249" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="249" text-anchor="end" font-weight="bold" fill="#0891B2">TribalNet (Hill Topo Disaster &amp; SAR Mesh)</text>

    <!-- Row 4 -->
