<svg viewBox="0 0 1180 610" width="1180" height="610" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Clip path for MAX7219 LED Matrix Display -->
    <clipPath id="matrix-clip-hills-light">
      <rect x="68" y="468" width="364" height="34" rx="4"/>
    </clipPath>
    <!-- LED Matrix Grid Pattern -->
    <pattern id="dot-grid-hills-light" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="0.8" fill="#334155" opacity="0.8"/>
    </pattern>
  </defs>

  <!-- Main Background Card Container -->
  <rect x="0" y="0" width="1180" height="610" rx="14" fill="#F4F3EF"/>
  <rect x="0" y="0" width="1180" height="610" rx="14" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Top Window Bar -->
  <rect x="0" y="0" width="1180" height="34" rx="14" fill="#FFFFFF"/>
  <rect x="0" y="20" width="1180" height="14" fill="#FFFFFF"/>
  <circle cx="22" cy="17" r="6" fill="#FF5F56"/>
  <circle cx="42" cy="17" r="6" fill="#FFBD2E"/>
  <circle cx="62" cy="17" r="6" fill="#27C93F"/>
  <text x="590.0" y="21" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="12.5" fill="#94A3B8">tribalnet_hills_topo_map.sh --hill-scan --lora-433mhz</text>

  <!-- Section Titles & Live Indicator -->
  <text x="46" y="82" font-family="monospace" font-size="12" letter-spacing="2" fill="#0891B2">HILL_TOPO.RADAR_MAP</text>
  <text x="516" y="82" font-family="monospace" font-size="12" letter-spacing="2" fill="#0891B2">TELEMETRY.INFO</text>
  <circle cx="1072" cy="78" r="4" fill="#EF4444">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="1082" y="82" font-family="monospace" font-size="12" letter-spacing="1.5" fill="#EF4444">LIVE SAR SCAN</text>

  <!-- LEFT PANEL: Topographical Hill Map Radar -->
  <rect x="46" y="100" width="410" height="454" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>

  <!-- Radar Crosshairs & Radial Search Grid -->
  <g opacity="0.3" stroke="#0891B2" stroke-width="0.8">
    <line x1="46" y1="270" x2="456" y2="270" stroke-dasharray="3 3"/>
    <line x1="251" y1="100" x2="251" y2="456" stroke-dasharray="3 3"/>
    <circle cx="251" cy="270" r="60" fill="none"/>
    <circle cx="251" cy="270" r="115" fill="none"/>
    <circle cx="251" cy="270" r="155" fill="none"/>
  </g>

  <!-- TOPOGRAPHICAL HILL ELEVATION CONTOURS -->
  <!-- Hill Peak 1: North-West Ridge (Elev 1120m) -->
  <g fill="none" stroke="#0891B2" stroke-width="1.2">
    <!-- Outer Contour 400m -->
    <path d="M 75 180 C 95 125, 205 125, 225 180 C 245 225, 145 255, 75 180 Z" opacity="0.3"/>
    <!-- Mid Contour 700m -->
    <path d="M 95 175 C 110 135, 185 135, 205 175 C 215 205, 140 225, 95 175 Z" opacity="0.45"/>
    <!-- Peak Contour 1000m -->
    <path d="M 120 170 C 130 145, 170 145, 180 170 C 185 185, 135 195, 120 170 Z" stroke="#0891B2" stroke-width="1.5" opacity="0.7" fill="#0891B2" fill-opacity="0.08"/>
    <text x="148" y="165" text-anchor="middle" font-family="monospace" font-size="8" fill="#0891B2">▲ 1120m PEAK</text>
  </g>

  <!-- Hill Peak 2: East Ridge (Elev 750m) -->
  <g fill="none" stroke="#0891B2" stroke-width="1.2">
    <path d="M 310 160 C 330 115, 425 125, 435 175 C 445 215, 355 235, 310 160 Z" opacity="0.3"/>
    <path d="M 330 165 C 345 130, 405 135, 415 170 C 420 195, 360 210, 330 165 Z" stroke="#0891B2" stroke-width="1.4" opacity="0.55"/>
    <text x="372" y="160" text-anchor="middle" font-family="monospace" font-size="8" fill="#0891B2">▲ 750m RIDGE</text>
  </g>

  <!-- Hill Peak 3: South-East Forest Mountain Range (Elev 980m - SAR SOS Zone) -->
  <g fill="none" stroke="#EF4444" stroke-width="1.2">
    <!-- Outer Contour 300m -->
    <path d="M 105 375 C 125 310, 255 315, 275 375 C 285 430, 175 440, 105 375 Z" opacity="0.35" stroke="#0891B2"/>
    <!-- Mid Contour 600m -->
    <path d="M 125 378 C 140 330, 235 332, 250 378 C 260 415, 160 422, 125 378 Z" opacity="0.5" stroke="#0891B2"/>
    <!-- High Danger Contour 850m -->
    <path d="M 145 380 C 155 348, 210 350, 220 380 C 225 400, 160 405, 145 380 Z" stroke="#EF4444" stroke-width="1.5" opacity="0.85" fill="#EF4444" fill-opacity="0.12"/>
    <text x="182" y="344" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#EF4444">⛰️ DEEP FOREST HILLS (850m)</text>
  </g>

  <!-- Mountain River Valley Path -->
  <path d="M 46 215 Q 160 240, 251 270 T 456 315" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="5 3" fill="none" opacity="0.6"/>
  <text x="330" y="278" font-family="monospace" font-size="8" fill="#0284C7">🌊 MOUNTAIN RIVER VALLEY</text>

  <!-- Rotating Radar Scanner Beam -->
  <g transform="translate(0,0)">
    <path d="M 251 270 L 251 115 A 155 155 0 0 1 360.6 160.4 Z" fill="#0891B2" opacity="0.16"/>
    <animateTransform attributeName="transform" type="rotate" from="0 251 270" to="360 251 270" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- MAP NODE 1: Central Command Station (Base Camp) -->
  <circle cx="251" cy="270" r="6" fill="#0891B2"/>
  <circle cx="251" cy="270" fill="none" stroke="#0891B2" stroke-width="1.5">
    <animate attributeName="r" values="6;22;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="251" y="294" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="bold" fill="#0891B2">BASE CAMP GATEWAY</text>

  <!-- MAP NODE 2: Village 01 (Valley Base - Safe) -->
  <g>
    <circle cx="130" cy="205" r="4.5" fill="#16A34A"/>
    <circle cx="130" cy="205" fill="none" stroke="#16A34A">
      <animate attributeName="r" values="4.5;14;4.5" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="130" y="220" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="bold" fill="#16A34A">VILLAGE 01 [SAFE]</text>
  </g>

  <!-- MAP NODE 3: Village 02 (Ridge Station - Alert) -->
  <g>
    <circle cx="365" cy="185" r="5" fill="#D97706"/>
    <circle cx="365" cy="185" fill="none" stroke="#D97706" stroke-width="1.5">
      <animate attributeName="r" values="5;18;5" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.1;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="365" y="173" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="bold" fill="#D97706">VILLAGE 02 ⚠️ ALERT</text>
  </g>

  <!-- MAP NODE 4: MISSING PERSON SOS BEACON IN RUGGED HILL FORESTS -->
  <g>
    <!-- Target Crosshairs around Hill SOS Beacon -->
    <line x1="162" y1="380" x2="202" y2="380" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="3 2"/>
    <line x1="182" y1="360" x2="182" y2="400" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="3 2"/>
    
    <!-- Pulsing Red SOS Beacon -->
    <circle cx="182" cy="380" r="5.5" fill="#EF4444">
      <animate attributeName="opacity" values="1;0.15;1" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Expanding Emergency SOS Shockwave Rings -->
    <circle cx="182" cy="380" fill="none" stroke="#EF4444" stroke-width="1.8">
      <animate attributeName="r" values="5.5;34;5.5" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Beacon Tag -->
    <rect x="105" y="405" width="154" height="18" rx="3" fill="#FFFFFF" stroke="#EF4444" stroke-width="0.8"/>
    <text x="182" y="417" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="bold" fill="#EF4444">🚨 MISSING PERSON IN HILLS</text>
  </g>

  <!-- LoRa Telemetry Packets (Hill SOS -> Base Camp) -->
  <line x1="182" y1="380" x2="251" y2="270" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.75"/>
  <circle cy="380" r="3.5" fill="#EF4444">
    <animate attributeName="cx" values="182;251;182" dur="2.1s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="380;270;380" dur="2.1s" repeatCount="indefinite"/>
