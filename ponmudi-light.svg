    <text x="557.6" y="222" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="222" text-anchor="end" fill="#0F172A">RF / SDR + Embedded Systems Engineer</text>

    <!-- Row 3: Flagship Project -->
    <text x="516" y="249" fill="#94A3B8">Project</text>
    <text x="579.8" y="249" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="249" text-anchor="end" font-weight="bold" fill="#0891B2">TribalNet (LoRa Emergency Comm Link)</text>

    <!-- Row 4 -->
    <text x="516" y="276" fill="#94A3B8">Hardware</text>
    <text x="587.2" y="276" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="276" text-anchor="end" fill="#0F172A">ESP32, SX1278, MAX7219 8x32 Matrix</text>

    <!-- Row 5 -->
    <text x="516" y="303" fill="#94A3B8">Origin</text>
    <text x="572.4" y="303" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="303" text-anchor="end" fill="#0F172A">Coimbatore, Tamil Nadu</text>

    <!-- Row 6 -->
    <text x="516" y="330" fill="#94A3B8">Education</text>
    <text x="594.6" y="330" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="330" text-anchor="end" fill="#0F172A">B.E. ECE, 2nd Year - BIT Sathyamangalam</text>

    <!-- Row 7 -->
    <text x="516" y="357" fill="#94A3B8">Status</text>
    <text x="572.4" y="357" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="357" text-anchor="end" fill="#0F172A">Designing + Prototyping + Shipping</text>

    <!-- Row 8 -->
    <text x="516" y="384" fill="#94A3B8">ToolChain</text>
    <text x="594.6" y="384" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="384" text-anchor="end" fill="#0F172A">SDR++, GNURadio, Zephyr, Altium, Arduino</text>

    <!-- Row 9 -->
    <text x="516" y="411" fill="#94A3B8">Core.Lang</text>
    <text x="594.6" y="411" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="411" text-anchor="end" fill="#0F172A">Embedded C, C++, Python</text>

    <!-- Row 10 -->
    <text x="516" y="438" fill="#94A3B8">Core.Domain</text>
    <text x="609.4" y="438" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="438" text-anchor="end" fill="#0F172A">RF/SDR, LoRa Mesh, LEO-PNT</text>

    <!-- Row 11 -->
    <text x="516" y="465" fill="#94A3B8">Core.Team</text>
    <text x="594.6" y="465" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="465" text-anchor="end" fill="#0F172A">Team 404 (BIT Sathyamangalam)</text>

    <!-- Row 12 -->
    <text x="516" y="492" fill="#94A3B8">Grid.Mail</text>
    <text x="594.6" y="492" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="492" text-anchor="end" fill="#0F172A">mrponmudi747@gmail.com</text>

    <!-- Row 13 -->
    <text x="516" y="519" fill="#94A3B8">Grid.GitHub</text>
    <text x="609.4" y="519" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="519" text-anchor="end" fill="#0F172A">ponmudimr</text>
  </g>

  <!-- Full Board Cyber Scanline Animation -->
  <line x1="0" y1="0" x2="1180" y2="0" stroke="#0891B2" stroke-width="1.5" opacity="0.15">
    <animate attributeName="y1" values="34;610;34" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="34;610;34" dur="7s" repeatCount="indefinite"/>
  </line>
</svg>