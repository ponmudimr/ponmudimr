    <!-- Row 1 -->
    <text x="516" y="195" fill="#6E7681">Subject</text>
    <text x="579.8" y="195" fill="#30363D"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="195" text-anchor="end" font-weight="bold" fill="#E6EDF3">Ponmudi MR</text>

    <!-- Row 2 -->
    <text x="516" y="222" fill="#6E7681">Role</text>
    <text x="557.6" y="222" fill="#30363D"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="222" text-anchor="end" fill="#E6EDF3">RF / SDR + Embedded Systems Engineer</text>

    <!-- Row 3: Flagship Project -->
    <text x="516" y="249" fill="#6E7681">Project</text>
    <text x="579.8" y="249" fill="#30363D"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="249" text-anchor="end" font-weight="bold" fill="#00FF9D">TribalNet (Hill Topo Disaster &amp; SAR Mesh)</text>

    <!-- Row 4 -->
    <text x="516" y="276" fill="#6E7681">Topology</text>
    <text x="587.2" y="276" fill="#30363D"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="276" text-anchor="end" fill="#E6EDF3">Hill Contours + Forest SOS Beacon + Base Camp</text>

    <!-- Row 5 -->
    <text x="516" y="303" fill="#6E7681">Hardware</text>
    <text x="587.2" y="303" fill="#30363D"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="303" text-anchor="end" fill="#E6EDF3">ESP32, SX1278 LoRa, Solar BMS, Panic SOS</text>

    <!-- Row 6 -->
    <text x="516" y="330" fill="#6E7681">Origin</text>
    <text x="572.4" y="330" fill="#30363D"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="330" text-anchor="end" fill="#E6EDF3">Coimbatore, Tamil Nadu</text>

    <!-- Row 7 -->
    <text x="516" y="357" fill="#6E7681">Education</text>
    <text x="594.6" y="357" fill="#30363D"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="357" text-anchor="end" fill="#E6EDF3">B.E. ECE, 2nd Year - BIT Sathyamangalam</text>

    <!-- Row 8 -->
    <text x="516" y="384" fill="#6E7681">Status</text>
    <text x="572.4" y="384" fill="#30363D"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="384" text-anchor="end" fill="#E6EDF3">Designing + Prototyping + Shipping</text>

    <!-- Row 9 -->
    <text x="516" y="411" fill="#6E7681">ToolChain</text>
    <text x="594.6" y="411" fill="#30363D"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="411" text-anchor="end" fill="#E6EDF3">SDR++, GNURadio, Zephyr, Altium, Arduino</text>

    <!-- Row 10 -->
    <text x="516" y="438" fill="#6E7681">Core.Lang</text>
    <text x="594.6" y="438" fill="#30363D"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="438" text-anchor="end" fill="#E6EDF3">Embedded C, C++, Python</text>

    <!-- Row 11 -->
    <text x="516" y="465" fill="#6E7681">Core.Domain</text>
    <text x="609.4" y="465" fill="#30363D"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="465" text-anchor="end" fill="#E6EDF3">RF/SDR, LoRa Mesh, LEO-PNT, SAR Systems</text>

    <!-- Row 12 -->
    <text x="516" y="492" fill="#6E7681">Core.Team</text>
    <text x="594.6" y="492" fill="#30363D"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="492" text-anchor="end" fill="#E6EDF3">Team 404 (BIT Sathyamangalam)</text>

    <!-- Row 13 -->
    <text x="516" y="519" fill="#6E7681">Grid.GitHub</text>
    <text x="609.4" y="519" fill="#30363D"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="519" text-anchor="end" fill="#E6EDF3">ponmudimr</text>
  </g>

  <!-- Full Board Cyber Scanline Animation -->
  <line x1="0" y1="0" x2="1180" y2="0" stroke="#00FF9D" stroke-width="1.5" opacity="0.12">
    <animate attributeName="y1" values="34;610;34" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="34;610;34" dur="7s" repeatCount="indefinite"/>
  </line>
</svg>