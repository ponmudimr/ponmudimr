<svg viewBox="0 0 1180 610" width="1180" height="610" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Clip path for MAX7219 LED Matrix Display -->
    <clipPath id="matrix-clip-sar-light">
      <rect x="68" y="468" width="364" height="34" rx="4"/>
    </clipPath>
    <!-- LED Matrix Grid Pattern -->
    <pattern id="dot-grid-sar-light" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="0.8" fill="#334155" opacity="0.8"/>
    </pattern>
  </defs>

  <!-- Main Background Card Container -->
  <rect x="0" y="0" width="1180" height="610" rx="14" fill="#F4F3EF"/>
  <rect x="0" y="0" width="1180" height="610" rx="14" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Top Window Bar -->
  <rect x="0" y="0" width="1180" height="34" rx="14" fill="#FFFFFF"/>
  <rect x="0" y="20" width="1180" height="14" fill="#FFFFFF"/>
  <circle cx="22" cy="17" r="6" fill="#FF5F56"/>
  <circle cx="42" cy="17" r="6" fill="#FFBD2E"/>
  <circle cx="62" cy="17" r="6" fill="#27C93F"/>
  <text x="590.0" y="21" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="12.5" fill="#94A3B8">tribalnet_sar_map.sh --scan-alerts --lora-433mhz</text>

  <!-- Section Titles & Live Indicator -->
  <text x="46" y="82" font-family="monospace" font-size="12" letter-spacing="2" fill="#0891B2">TRIBALNET.SAR_MAP</text>
  <text x="516" y="82" font-family="monospace" font-size="12" letter-spacing="2" fill="#0891B2">TELEMETRY.INFO</text>
  <circle cx="1072" cy="78" r="4" fill="#EF4444">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="1082" y="82" font-family="monospace" font-size="12" letter-spacing="1.5" fill="#EF4444">LIVE SAR SCAN</text>

  <!-- LEFT PANEL: Disaster & Forest Search Radar Map -->
  <rect x="46" y="100" width="410" height="454" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>

  <!-- Map Sector Background Grid & Topo Rings -->
  <g opacity="0.35" stroke="#0891B2" stroke-width="0.8">
    <!-- Topo Grid Lines -->
    <line x1="46" y1="270" x2="456" y2="270" stroke-dasharray="3 3"/>
    <line x1="251" y1="100" x2="251" y2="456" stroke-dasharray="3 3"/>
    <line x1="100" y1="120" x2="400" y2="420" stroke-dasharray="2 4"/>
    <line x1="400" y1="120" x2="100" y2="420" stroke-dasharray="2 4"/>
    
    <!-- Concentric Radar Search Rings -->
    <circle cx="251" cy="270" r="50" fill="none"/>
    <circle cx="251" cy="270" r="105" fill="none"/>
    <circle cx="251" cy="270" r="155" fill="none"/>
  </g>

  <!-- Sector Labels -->
  <text x="60" y="122" font-family="monospace" font-size="9" fill="#94A3B8">SECTOR 01: NORTH VILLAGES</text>
  <text x="60" y="445" font-family="monospace" font-size="9" fill="#EF4444">SECTOR 03: DEEP FOREST (SAR ZONE)</text>
  <text x="446" y="122" text-anchor="end" font-family="monospace" font-size="9" fill="#94A3B8">SECTOR 02: EAST RIDGE</text>

  <!-- Rotating Radar Scanner Beam -->
  <g transform="translate(0,0)">
    <path d="M 251 270 L 251 115 A 155 155 0 0 1 360.6 160.4 Z" fill="#0891B2" opacity="0.16"/>
    <animateTransform attributeName="transform" type="rotate" from="0 251 270" to="360 251 270" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- MAP NODE 1: Central Command Station (Gateway Hub) -->
  <circle cx="251" cy="270" r="6" fill="#0891B2"/>
  <circle cx="251" cy="270" fill="none" stroke="#0891B2" stroke-width="1.5">
    <animate attributeName="r" values="6;22;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="251" y="292" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="bold" fill="#0891B2">COMMAND GATEWAY HUB</text>

  <!-- MAP NODE 2: Village 01 (Safe) -->
  <g>
    <circle cx="140" cy="175" r="4.5" fill="#16A34A"/>
    <circle cx="140" cy="175" fill="none" stroke="#16A34A">
      <animate attributeName="r" values="4.5;14;4.5" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="140" y="163" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#16A34A">VILLAGE 01 [SAFE]</text>
  </g>

  <!-- MAP NODE 3: Village 02 (Emergency Alert) -->
  <g>
    <circle cx="360" cy="190" r="5" fill="#D97706"/>
    <circle cx="360" cy="190" fill="none" stroke="#D97706" stroke-width="1.5">
      <animate attributeName="r" values="5;18;5" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.1;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="360" y="178" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#D97706">VILLAGE 02 ⚠️ ALERT</text>
  </g>

  <!-- MAP NODE 4: MISSING PERSON SOS BEACON IN DEEP FOREST -->
  <g>
    <!-- Crosshair Target Box around Missing Person -->
    <rect x="136" y="366" width="36" height="36" fill="none" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="4 2"/>
    
    <!-- Pulsing Red SOS Beacon -->
    <circle cx="154" cy="384" r="5" fill="#EF4444">
      <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Expanding Emergency SOS Shockwave Rings -->
    <circle cx="154" cy="384" fill="none" stroke="#EF4444" stroke-width="1.8">
      <animate attributeName="r" values="5;32;5" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Beacon Label -->
    <rect x="80" y="408" width="155" height="18" rx="3" fill="#FFFFFF" stroke="#EF4444" stroke-width="0.8"/>
    <text x="157" y="420" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="bold" fill="#EF4444">🚨 MISSING PERSON (SOS)</text>
  </g>

  <!-- LoRa Telemetry Packets (Missing Person SOS -> Command Hub) -->
  <line x1="154" y1="384" x2="251" y2="270" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
  <circle cy="384" r="3.5" fill="#EF4444">
    <animate attributeName="cx" values="154;251;154" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="384;270;384" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- LoRa Telemetry Packets (Village 02 -> Command Hub) -->
  <line x1="360" y1="190" x2="251" y2="270" stroke="#D97706" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  <circle cy="190" r="3" fill="#D97706">
    <animate attributeName="cx" values="360;251;360" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="190;270;190" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- MAX7219 8x32 LED Matrix Live Emergency Alert Feed -->
  <rect x="62" y="456" width="376" height="48" rx="6" fill="#0F172A" stroke="#CBD5E1"/>
  <rect x="68" y="462" width="364" height="36" fill="url(#dot-grid-sar-light)"/>
  <g clip-path="url(#matrix-clip-sar-light)">
    <g>
      <text x="380" y="485" font-family="Courier, monospace" font-size="14" font-weight="bold" letter-spacing="2.5" fill="#FF4D4D" filter="drop-shadow(0px 0px 3px #FF4D4D)">
        🚨 EMERGENCY ALERT: MISSING PERSON DETECTED IN DEEP FOREST SECTOR • LORA SOS SIGNAL RECEIVED (433 MHz) • SAR SEARCH TEAM DISPATCHED • VILLAGE 02 FLOOD WARNING ACTIVE •
      </text>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-880 0" dur="11s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Handle Badge Pill -->
  <rect x="62" y="516" width="376" height="26" rx="13" fill="#FFFFFF" stroke="#0891B2" stroke-width="1"/>
  <text x="250" y="533" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="bold" fill="#0891B2">@ponmudimr / TribalNet SAR Radar</text>

  <!-- RIGHT PANEL: System Telemetry & Engineer Profile -->
  <!-- Header Telemetry Box -->
  <rect x="496" y="100" width="638" height="60" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="516" y="122" font-family="monospace" font-size="11" font-weight="bold" fill="#0891B2">TRIBALNET OFF-GRID DISASTER &amp; SAR TELEMETRY</text>
  <text x="516" y="144" font-family="monospace" font-size="10" fill="#0F172A">LORA: 433.00 MHz  |  NODES: 3 ACTIVE  |  FOREST SOS: LINK OK  |  SAR: EN ROUTE</text>

  <!-- Profile Details Key-Value List -->
  <g font-family="monospace" font-size="13">
    <!-- Row 1 -->
    <text x="516" y="195" fill="#94A3B8">Subject</text>
    <text x="579.8" y="195" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="195" text-anchor="end" font-weight="bold" fill="#0F172A">Ponmudi MR</text>

    <!-- Row 2 -->
    <text x="516" y="222" fill="#94A3B8">Role</text>
    <text x="557.6" y="222" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="222" text-anchor="end" fill="#0F172A">RF / SDR + Embedded Systems Engineer</text>

    <!-- Row 3: Flagship Project -->
    <text x="516" y="249" fill="#94A3B8">Project</text>
    <text x="579.8" y="249" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="249" text-anchor="end" font-weight="bold" fill="#0891B2">TribalNet (Off-Grid Disaster &amp; SAR Mesh)</text>

    <!-- Row 4 -->
    <text x="516" y="276" fill="#94A3B8">Topology</text>
    <text x="587.2" y="276" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="276" text-anchor="end" fill="#0F172A">Village Nodes + Forest SAR + Command Hub</text>

    <!-- Row 5 -->
    <text x="516" y="303" fill="#94A3B8">Hardware</text>
    <text x="587.2" y="303" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="303" text-anchor="end" fill="#0F172A">ESP32, SX1278 LoRa, Solar BMS, Panic SOS</text>

    <!-- Row 6 -->
    <text x="516" y="330" fill="#94A3B8">Origin</text>
    <text x="572.4" y="330" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="330" text-anchor="end" fill="#0F172A">Coimbatore, Tamil Nadu</text>

    <!-- Row 7 -->
    <text x="516" y="357" fill="#94A3B8">Education</text>
    <text x="594.6" y="357" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="357" text-anchor="end" fill="#0F172A">B.E. ECE, 2nd Year - BIT Sathyamangalam</text>

    <!-- Row 8 -->
    <text x="516" y="384" fill="#94A3B8">Status</text>
    <text x="572.4" y="384" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="384" text-anchor="end" fill="#0F172A">Designing + Prototyping + Shipping</text>

    <!-- Row 9 -->
    <text x="516" y="411" fill="#94A3B8">ToolChain</text>
    <text x="594.6" y="411" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="411" text-anchor="end" fill="#0F172A">SDR++, GNURadio, Zephyr, Altium, Arduino</text>

    <!-- Row 10 -->
    <text x="516" y="438" fill="#94A3B8">Core.Lang</text>
    <text x="594.6" y="438" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="438" text-anchor="end" fill="#0F172A">Embedded C, C++, Python</text>

    <!-- Row 11 -->
    <text x="516" y="465" fill="#94A3B8">Core.Domain</text>
    <text x="609.4" y="465" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="465" text-anchor="end" fill="#0F172A">RF/SDR, LoRa Mesh, LEO-PNT, SAR Systems</text>

    <!-- Row 12 -->
    <text x="516" y="492" fill="#94A3B8">Core.Team</text>
    <text x="594.6" y="492" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="492" text-anchor="end" fill="#0F172A">Team 404 (BIT Sathyamangalam)</text>

    <!-- Row 13 -->
    <text x="516" y="519" fill="#94A3B8">Grid.GitHub</text>
    <text x="609.4" y="519" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="519" text-anchor="end" fill="#0F172A">ponmudimr</text>
  </g>

  <!-- Full Board Cyber Scanline Animation -->
  <line x1="0" y1="0" x2="1180" y2="0" stroke="#0891B2" stroke-width="1.5" opacity="0.15">
    <animate attributeName="y1" values="34;610;34" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="34;610;34" dur="7s" repeatCount="indefinite"/>
  </line>
</svg>