    <!-- Row 1 -->
    <text x="516" y="195" fill="#94A3B8">Subject</text>
    <text x="579.8" y="195" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="1134" y="195" text-anchor="end" font-weight="bold" fill="#0F172A">Ponmudi MR</text>

    <!-- Row 2 -->
