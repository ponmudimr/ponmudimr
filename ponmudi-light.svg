    <text x="516" y="384" fill="#94A3B8">Status</text>
    <text x="572.4" y="384" fill="#E2E8F0"> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
