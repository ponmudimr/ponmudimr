<svg viewBox="0 0 1180 610" width="1180" height="610" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Clip path for MAX7219 LED Matrix Display -->
    <clipPath id="matrix-clip-light">
      <rect x="72" y="272" width="356" height="46" rx="4"/>
    </clipPath>
    <!-- Clip path for Oscilloscope Display -->
    <clipPath id="scope-clip-light">
      <rect x="72" y="372" width="356" height="76" rx="4"/>
    </clipPath>
    <!-- LED Matrix Grid Pattern -->
    <pattern id="dot-grid-light" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#334155" opacity="0.8"/>
    </pattern>
  </defs>

  <!-- Main Container -->
  <rect x="0" y="0" width="1180" height="610" rx="14" fill="#F4F3EF"/>
  <rect x="0" y="0" width="1180" height="610" rx="14" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="1180" height="34" rx="14" fill="#FFFFFF"/>
  <rect x="0" y="20" width="1180" height="14" fill="#FFFFFF"/>
  <circle cx="22" cy="17" r="6" fill="#FF5F56"/>
  <circle cx="42" cy="17" r="6" fill="#FFBD2E"/>
  <circle cx="62" cy="17" r="6" fill="#27C93F"/>
  <text x="590.0" y="21" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="12.5" fill="#94A3B8">tribalnet.sh --lora-mesh-433mhz</text>

  <!-- Section Titles & Live Indicator -->
  <text x="46" y="82" font-family="monospace" font-size="12" letter-spacing="2" fill="#0891B2">TRIBALNET.TOPOLOGY</text>
  <text x="516" y="82" font-family="monospace" font-size="12" letter-spacing="2" fill="#0891B2">SYSTEM.TELEMETRY</text>
  <circle cx="1072" cy="78" r="4" fill="#EF4444">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="1082" y="82" font-family="monospace" font-size="12" letter-spacing="1.5" fill="#EF4444">LIVE</text>

  <!-- LEFT PANEL: TribalNet LoRa Hardware Topology & Displays -->
  <rect x="46" y="100" width="410" height="454" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>

  <!-- Node 1: RANGER STATION -->
  <rect x="66" y="120" width="130" height="85" rx="6" fill="#F8FAFC" stroke="#0891B2" stroke-width="1.2"/>
  <text x="131" y="140" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#0891B2">RANGER NODE</text>
  <text x="131" y="158" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#0F172A">ESP32 WROOM-32</text>
  <text x="131" y="174" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748B">SX1278 (433MHz)</text>
  <text x="131" y="190" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#D97706">Serial Command</text>
  
  <!-- Ranger Antenna & RF Waves -->
  <line x1="196" y1="162.5" x2="216" y2="162.5" stroke="#0891B2" stroke-width="2"/>
  <circle cx="216" cy="162.5" r="3" fill="#0891B2"/>
  <circle cx="216" cy="162.5" fill="none" stroke="#0891B2">
    <animate attributeName="r" values="3;28;3" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- LoRa Wireless Link & Moving Packets -->
  <line x1="216" y1="162.5" x2="286" y2="162.5" stroke="#0891B2" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
  <text x="251" y="153" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#0891B2">LoRa RF Link</text>
  <text x="251" y="176" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748B">433 MHz</text>

  <!-- Packet 1: Ranger to Village -->
  <circle cy="162.5" r="3.5" fill="#0891B2">
    <animate attributeName="cx" values="216;286;216" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <!-- Packet 2: Village to Ranger (Offset) -->
  <circle cy="162.5" r="2.5" fill="#EF4444">
    <animate attributeName="cx" values="286;216;286" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 2: VILLAGE STATION -->
  <rect x="306" y="120" width="130" height="85" rx="6" fill="#F8FAFC" stroke="#0891B2" stroke-width="1.2"/>
  <text x="371" y="140" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#0891B2">VILLAGE NODE</text>
  <text x="371" y="158" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#0F172A">ESP32 + MAX7219</text>
  <text x="371" y="174" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748B">SX1278 + Buttons</text>
  <text x="371" y="190" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#EF4444">Alert Trigger</text>

  <!-- Village Antenna & RF Waves -->
  <line x1="306" y1="162.5" x2="286" y2="162.5" stroke="#0891B2" stroke-width="2"/>
  <circle cx="286" cy="162.5" r="3" fill="#0891B2"/>
  <circle cx="286" cy="162.5" fill="none" stroke="#0891B2">
    <animate attributeName="r" values="3;28;3" dur="2.2s" repeatCount="indefinite" begin="0.8s"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2.2s" repeatCount="indefinite" begin="0.8s"/>
  </circle>

  <!-- Display 1: MAX7219 8x32 LED Matrix Simulation -->
  <text x="66" y="232" font-family="monospace" font-size="10" letter-spacing="1" fill="#64748B">MAX7219 8x32 LED MATRIX DISPLAY</text>
  <rect x="66" y="240" width="370" height="54" rx="6" fill="#0F172A" stroke="#CBD5E1"/>
  <rect x="72" y="246" width="358" height="42" fill="url(#dot-grid-light)"/>
  
  <!-- Scrolling Marquee Text inside Matrix -->
  <g clip-path="url(#matrix-clip-light)">
    <g>
      <text x="400" y="272" font-family="Courier, monospace" font-size="15" font-weight="bold" letter-spacing="3" fill="#00F0FF" filter="drop-shadow(0px 0px 3px #00F0FF)">
        ⚠️ EMERGENCY ALERT: VILLAGE IS SAFE! • LORA LINK ACTIVE (433 MHz) • RANGER-VILLAGE CONNECTED •
      </text>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-780 0" dur="10s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Display 2: Oscilloscope RF Signal Chirp Waveform -->
  <text x="66" y="322" font-family="monospace" font-size="10" letter-spacing="1" fill="#64748B">RF SIGNAL SCOPE (SX1278 CHIRP MODULATION)</text>
  <rect x="66" y="330" width="370" height="115" rx="6" fill="#0F172A" stroke="#CBD5E1"/>
  
  <!-- Oscilloscope Grid Lines -->
  <line x1="66" y1="387.5" x2="436" y2="387.5" stroke="#1E293B" stroke-dasharray="3 3"/>
  <line x1="251" y1="330" x2="251" y2="445" stroke="#1E293B" stroke-dasharray="3 3"/>
  
  <!-- Dynamic Oscilloscope Waveform -->
  <g clip-path="url(#scope-clip-light)">
    <path d="M 72 387.5 Q 92 340, 112 387.5 T 152 387.5 T 192 387.5 Q 207 350, 222 387.5 T 252 387.5 Q 272 335, 292 387.5 T 332 387.5 Q 362 345, 392 387.5 T 432 387.5" fill="none" stroke="#00F0FF" stroke-width="2">
      <animate attributeName="d" values="
        M 72 387.5 Q 92 340, 112 387.5 T 152 387.5 T 192 387.5 Q 207 350, 222 387.5 T 252 387.5 Q 272 335, 292 387.5 T 332 387.5 Q 362 345, 392 387.5 T 432 387.5;
        M 72 387.5 Q 92 435, 112 387.5 T 152 387.5 T 192 387.5 Q 207 425, 222 387.5 T 252 387.5 Q 272 440, 292 387.5 T 332 387.5 Q 362 430, 392 387.5 T 432 387.5;
        M 72 387.5 Q 92 340, 112 387.5 T 152 387.5 T 192 387.5 Q 207 350, 222 387.5 T 252 387.5 Q 272 335, 292 387.5 T 332 387.5 Q 362 345, 392 387.5 T 432 387.5"
        dur="1.8s" repeatCount="indefinite"/>
    </path>
    <!-- Scope Leading Laser Tracer -->
    <circle cx="251" cy="387.5" r="4" fill="#00F0FF">
      <animate attributeName="cx" values="72;432;72" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="387.5;350;425;387.5" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="76" y="438" font-family="monospace" font-size="8.5" fill="#00F0FF">BW: 125kHz | SF: 7 | CR: 4/5</text>
  <text x="426" y="438" text-anchor="end" font-family="monospace" font-size="8.5" fill="#94A3B8">433.00 MHz</text>

  <!-- Handle Badge Pill -->
  <rect x="66" y="512" width="370" height="28" rx="14" fill="#FFFFFF" stroke="#0891B2" stroke-width="1"/>
  <text x="251" y="530" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0891B2">@ponmudimr / TribalNet</text>

  <!-- RIGHT PANEL: LoRa Telemetry & Developer Profile -->
  <!-- Header Telemetry Box -->
  <rect x="496" y="100" width="638" height="60" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="516" y="122" font-family="monospace" font-size="11" font-weight="bold" fill="#0891B2">SYSTEM CONFIGURATION &amp; LORA TELEMETRY</text>
  <text x="516" y="144" font-family="monospace" font-size="10" fill="#0F172A">FREQ: 433.00 MHz  |  SF: 7  |  BW: 125 kHz  |  SYNC: 0xF3  |  CRC: ENABLED</text>

