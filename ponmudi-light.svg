  <line x1="365" y1="185" x2="251" y2="270" stroke="#D97706" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  <circle cy="185" r="3" fill="#D97706">
    <animate attributeName="cx" values="365;251;365" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="185;270;185" dur="2.5s" repeatCount="indefinite"/>
