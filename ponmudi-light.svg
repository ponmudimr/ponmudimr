<svg viewBox="0 0 1180 660" width="1180" height="660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Light UI Gradients -->
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="panel-grad-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="card-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="hill-grad-1-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="hill-grad-danger-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="radar-sweep-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Clip Path for LED Matrix Ticker -->
    <clipPath id="matrix-clip-v3-light">
      <rect x="74" y="528" width="372" height="34" rx="4"/>
    </clipPath>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern-light" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#CBD5E1" stroke-width="0.8" opacity="0.5"/>
    </pattern>
    <pattern id="dot-matrix-light" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#334155"/>
    </pattern>
  </defs>

  <!-- Main Card Container -->
  <rect x="0" y="0" width="1180" height="660" rx="16" fill="url(#bg-grad-light)"/>
  <rect x="0" y="0" width="1180" height="660" rx="16" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Subtle Tactical Grid Overlay -->
  <rect x="0" y="0" width="1180" height="660" rx="16" fill="url(#grid-pattern-light)"/>

  <!-- Window Header Bar -->
  <rect x="0" y="0" width="1180" height="42" rx="16" fill="#FFFFFF"/>
  <rect x="0" y="26" width="1180" height="16" fill="#FFFFFF"/>
  <line x1="0" y1="42" x2="1180" y2="42" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Window Buttons -->
  <circle cx="24" cy="21" r="6" fill="#FF5F56"/>
  <circle cx="44" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="64" cy="21" r="6" fill="#27C93F"/>

  <!-- Window Title -->
  <text x="590" y="26" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600" fill="#64748B" letter-spacing="1">
    TRIBALNET :: SATELLITE SAR &amp; LORA MESH HUD v3.4
  </text>

  <!-- Status Pill Header (Right) -->
  <g transform="translate(980, 12)">
    <rect x="0" y="0" width="176" height="20" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="0.8"/>
    <circle cx="12" cy="10" r="3.5" fill="#16A34A">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="14" font-family="monospace" font-size="9.5" font-weight="bold" fill="#16A34A" letter-spacing="0.5">MESH NETWORK ACTIVE</text>
  </g>

  <!-- ==================== LEFT PANEL: SAR RADAR MAP ==================== -->
  <g transform="translate(36, 58)">
    <!-- Panel Box -->
    <rect x="0" y="0" width="448" height="570" rx="10" fill="url(#panel-grad-light)" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- Panel Header Title -->
    <text x="20" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#0891B2" letter-spacing="1.5">
      📡 TACTICAL MAP :: SATHYAMANGALAM FORESTS
    </text>
    <text x="428" y="30" text-anchor="end" font-family="monospace" font-size="10" fill="#64748B">SECTOR 07</text>
    <line x1="20" y1="42" x2="428" y2="42" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Radar Map Canvas Area -->
    <g transform="translate(20, 54)">
      <rect x="0" y="0" width="408" height="400" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Topographical Hill Contours (3D Elevation Curves) -->
      <!-- Hill 1: North Ridge (Elev 1,120m) -->
      <path d="M 30 140 C 60 70, 180 70, 210 140 C 230 190, 120 210, 30 140 Z" fill="url(#hill-grad-1-light)" stroke="#0891B2" stroke-width="1" opacity="0.6"/>
      <path d="M 55 135 C 75 85, 160 85, 185 135 C 200 175, 110 190, 55 135 Z" fill="url(#hill-grad-1-light)" stroke="#0891B2" stroke-width="1" opacity="0.8"/>
      <path d="M 85 130 C 100 95, 140 95, 155 130 C 165 155, 110 165, 85 130 Z" fill="#0891B2" fill-opacity="0.1" stroke="#0891B2" stroke-width="1.2"/>
      <text x="120" y="122" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="bold" fill="#0891B2">▲ NORTH RIDGE (1,120m)</text>

      <!-- Hill 2: South-East Forest SAR Danger Zone (Elev 850m) -->
      <path d="M 180 290 C 210 210, 360 220, 385 290 C 400 350, 270 370, 180 290 Z" fill="url(#hill-grad-danger-light)" stroke="#EF4444" stroke-width="1" opacity="0.7"/>
      <path d="M 210 292 C 230 230, 330 235, 355 292 C 370 335, 270 350, 210 292 Z" fill="url(#hill-grad-danger-light)" stroke="#EF4444" stroke-width="1.2" opacity="0.9"/>
      <path d="M 245 295 C 260 250, 305 255, 320 295 C 330 325, 270 335, 245 295 Z" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1.5"/>
      <text x="282" y="248" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="bold" fill="#EF4444">⛰️ DEEP FOREST SAR ZONE (850m)</text>

      <!-- Mountain River Stream -->
      <path d="M 0 160 Q 140 190, 204 200 T 408 260" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6 3" fill="none" opacity="0.7"/>
      <text x="320" y="222" font-family="monospace" font-size="8" fill="#0284C7">🌊 BHAVANI RIVER VALLEY</text>

      <!-- Radial Radar Search Rings -->
      <g opacity="0.3" stroke="#0891B2" stroke-width="0.8">
        <circle cx="204" cy="200" r="60" fill="none"/>
        <circle cx="204" cy="200" r="120" fill="none"/>
        <circle cx="204" cy="200" r="175" fill="none"/>
        <line x1="0" y1="200" x2="408" y2="200" stroke-dasharray="3 3"/>
        <line x1="204" y1="0" x2="204" y2="400" stroke-dasharray="3 3"/>
      </g>

      <!-- 360 Degree Radar Sweep Beam -->
      <g transform="translate(0,0)">
        <path d="M 204 200 L 204 25 A 175 175 0 0 1 327.7 76.2 Z" fill="url(#radar-sweep-light)"/>
        <animateTransform attributeName="transform" type="rotate" from="0 204 200" to="360 204 200" dur="4s" repeatCount="indefinite"/>
      </g>

      <!-- NODE 1: Base Camp Command Gateway -->
      <g transform="translate(204, 200)">
        <circle cx="0" cy="0" r="6" fill="#0891B2"/>
        <circle cx="0" cy="0" fill="none" stroke="#0891B2" stroke-width="1.5">
          <animate attributeName="r" values="6;24;6" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.9;0;0.9" dur="2s" repeatCount="indefinite"/>
        </circle>
        <rect x="-65" y="12" width="130" height="18" rx="4" fill="#FFFFFF" stroke="#0891B2" stroke-width="0.8"/>
        <text x="0" y="24" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="bold" fill="#0891B2">BASE CAMP GATEWAY</text>
      </g>

      <!-- NODE 2: Village 01 (Safe) -->
      <g transform="translate(100, 130)">
        <circle cx="0" cy="0" r="5" fill="#16A34A"/>
        <circle cx="0" cy="0" fill="none" stroke="#16A34A">
          <animate attributeName="r" values="5;15;5" dur="2.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <rect x="-48" y="-22" width="96" height="16" rx="3" fill="#FFFFFF" stroke="#16A34A" stroke-width="0.6"/>
        <text x="0" y="-10" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#16A34A">VILLAGE 01 [SAFE]</text>
      </g>

      <!-- NODE 3: Village 02 (Ridge Alert) -->
      <g transform="translate(330, 120)">
        <circle cx="0" cy="0" r="5" fill="#D97706"/>
        <circle cx="0" cy="0" fill="none" stroke="#D97706" stroke-width="1.2">
          <animate attributeName="r" values="5;18;5" dur="1.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0.1;1" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <rect x="-52" y="-22" width="104" height="16" rx="3" fill="#FFFFFF" stroke="#D97706" stroke-width="0.6"/>
        <text x="0" y="-10" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#D97706">VILLAGE 02 ⚠️ ALERT</text>
      </g>

      <!-- NODE 4: MISSING PERSON SOS BEACON (Target Reticle) -->
      <g transform="translate(282, 295)">
        <line x1="-16" y1="0" x2="16" y2="0" stroke="#EF4444" stroke-width="1.2"/>
        <line x1="0" y1="-16" x2="0" y2="16" stroke="#EF4444" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="6" fill="#EF4444">
          <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="0" fill="none" stroke="#EF4444" stroke-width="1.8">
          <animate attributeName="r" values="6;36;6" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/>
        </circle>

        <!-- SOS Target Box Tag -->
        <rect x="-75" y="16" width="150" height="20" rx="4" fill="#FFFFFF" stroke="#EF4444" stroke-width="1"/>
        <text x="0" y="30" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="bold" fill="#EF4444">🚨 MISSING PERSON (SOS 433MHz)</text>
      </g>

      <!-- LoRa SOS Packet Trail (Forest SOS -> Base Camp) -->
      <path id="sos-path-light" d="M 282 295 Q 240 250, 204 200" fill="none" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8"/>
      <circle r="3.5" fill="#EF4444">
        <animateMotion dur="1.8s" repeatCount="indefinite">
          <mpath href="#sos-path-light"/>
        </animateMotion>
      </circle>

      <!-- LoRa Village Packet Trail (Village 02 -> Base Camp) -->
      <path id="v2-path-light" d="M 330 120 Q 260 160, 204 200" fill="none" stroke="#D97706" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
      <circle r="3" fill="#D97706">
        <animateMotion dur="2.4s" repeatCount="indefinite">
          <mpath href="#v2-path-light"/>
        </animateMotion>
      </circle>
    </g>

    <!-- LED Matrix Display Box (Bottom Panel) -->
    <g transform="translate(20, 466)">
      <rect x="0" y="0" width="408" height="46" rx="6" fill="#0F172A" stroke="#CBD5E1" stroke-width="1.2"/>
      <rect x="4" y="4" width="400" height="38" fill="url(#dot-matrix-light)"/>

      <!-- Scrolling Marquee Text -->
      <g clip-path="url(#matrix-clip-v3-light)">
        <g>
          <text x="410" y="550" font-family="'JetBrains Mono', Courier, monospace" font-size="13" font-weight="bold" fill="#FF4D4D" letter-spacing="2" filter="drop-shadow(0px 0px 3px #FF4D4D)">
            🚨 CRITICAL ALERT: MISSING PERSON SOS BEACON LOCATED IN SATHYAMANGALAM FOREST (ELEV 850m) • LORA SIGNAL: -84 dBm • SAR MOUNTAIN RESCUE TEAM DISPATCHED •
          </text>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-980 0" dur="12s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>

    <!-- Handle Pill -->
    <rect x="20" y="524" width="408" height="28" rx="14" fill="#FFFFFF" stroke="#0891B2" stroke-width="1"/>
    <text x="224" y="542" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#0891B2" letter-spacing="0.5">
      @ponmudimr / TribalNet SAR Radar
    </text>
  </g>

  <!-- ==================== RIGHT PANEL: TELEMETRY & PROFILE DOSSIER ==================== -->
  <g transform="translate(508, 58)">
    <!-- Panel Box -->
    <rect x="0" y="0" width="636" height="570" rx="10" fill="url(#panel-grad-light)" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- Panel Header Title -->
    <text x="24" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#0891B2" letter-spacing="1.5">
      📊 SYSTEM TELEMETRY &amp; ENGINEER DOSSIER
    </text>
    <text x="612" y="30" text-anchor="end" font-family="monospace" font-size="10" fill="#64748B">STATUS: ONLINE</text>
    <line x1="24" y1="42" x2="612" y2="42" stroke="#E2E8F0" stroke-width="1"/>

    <!-- TOP BOX: LORA RF PARAMETERS (4 Metric Cards) -->
    <g transform="translate(24, 54)">
      <!-- Card 1: Frequency -->
      <rect x="0" y="0" width="138" height="52" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="18" font-family="monospace" font-size="8.5" fill="#64748B">FREQUENCY</text>
      <text x="12" y="38" font-family="monospace" font-size="12" font-weight="bold" fill="#0891B2">433.00 MHz</text>

      <!-- Card 2: Modulation -->
      <rect x="150" y="0" width="138" height="52" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="162" y="18" font-family="monospace" font-size="8.5" fill="#64748B">MODULATION</text>
      <text x="162" y="38" font-family="monospace" font-size="12" font-weight="bold" fill="#0284C7">SF7 / BW 125k</text>

      <!-- Card 3: RSSI Signal -->
      <rect x="300" y="0" width="138" height="52" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="312" y="18" font-family="monospace" font-size="8.5" fill="#64748B">SIGNAL RSSI</text>
      <text x="312" y="38" font-family="monospace" font-size="12" font-weight="bold" fill="#D97706">-84 dBm (OK)</text>

      <!-- Card 4: Encryption -->
      <rect x="450" y="0" width="138" height="52" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="462" y="18" font-family="monospace" font-size="8.5" fill="#64748B">SECURITY</text>
      <text x="462" y="38" font-family="monospace" font-size="12" font-weight="bold" fill="#EF4444">CRC + AES-128</text>
    </g>

    <!-- MIDDLE SECTION: STRUCTURED PROFILE DOSSIER GRID -->
    <g transform="translate(24, 122)">

      <!-- Row 1: Engineer Name -->
      <rect x="0" y="0" width="588" height="42" rx="6" fill="url(#card-grad-light)" stroke="#E2E8F0" stroke-width="1"/>
      <text x="16" y="26" font-family="monospace" font-size="10.5" fill="#64748B">Engineer</text>
      <text x="572" y="26" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#0F172A">Ponmudi MR</text>

      <!-- Row 2: Role -->
      <rect x="0" y="48" width="588" height="42" rx="6" fill="url(#card-grad-light)" stroke="#E2E8F0" stroke-width="1"/>
      <text x="16" y="74" font-family="monospace" font-size="10.5" fill="#64748B">Specialization</text>
      <text x="572" y="74" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="bold" fill="#0284C7">RF / SDR + Embedded Systems Engineer</text>

      <!-- Row 3: Flagship Project -->
      <rect x="0" y="96" width="588" height="44" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1"/>
      <text x="16" y="123" font-family="monospace" font-size="10.5" font-weight="bold" fill="#16A34A">Flagship Project</text>
      <text x="572" y="123" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="bold" fill="#16A34A">TribalNet (Off-Grid SAR &amp; Disaster Mesh)</text>

      <!-- Row 4: System Hardware -->
      <rect x="0" y="146" width="588" height="42" rx="6" fill="url(#card-grad-light)" stroke="#E2E8F0" stroke-width="1"/>
      <text x="16" y="172" font-family="monospace" font-size="10.5" fill="#64748B">System Stack</text>
      <text x="572" y="172" text-anchor="end" font-family="monospace" font-size="12" fill="#0F172A">ESP32, SX1278 LoRa, Solar BMS, Panic SOS</text>

      <!-- Row 5: Core Domain -->
      <rect x="0" y="194" width="588" height="42" rx="6" fill="url(#card-grad-light)" stroke="#E2E8F0" stroke-width="1"/>
      <text x="16" y="220" font-family="monospace" font-size="10.5" fill="#64748B">Core Domains</text>
      <text x="572" y="220" text-anchor="end" font-family="monospace" font-size="12" fill="#0F172A">RF/SDR, LoRa Mesh, LEO-PNT, SAR Systems</text>

      <!-- Row 6: Toolchain & Software -->
      <rect x="0" y="242" width="588" height="42" rx="6" fill="url(#card-grad-light)" stroke="#E2E8F0" stroke-width="1"/>
      <text x="16" y="268" font-family="monospace" font-size="10.5" fill="#64748B">Toolchain</text>
      <text x="572" y="268" text-anchor="end" font-family="monospace" font-size="12" fill="#0F172A">SDR++, GNURadio, Zephyr, Altium, Embedded C</text>

      <!-- Row 7: Education & Team -->
      <rect x="0" y="290" width="288" height="42" rx="6" fill="url(#card-grad-light)" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="316" font-family="monospace" font-size="10" fill="#64748B">Education</text>
      <text x="274" y="316" text-anchor="end" font-family="monospace" font-size="11" font-weight="bold" fill="#0F172A">B.E. ECE - BIT Sathyamangalam</text>

      <rect x="300" y="290" width="288" height="42" rx="6" fill="url(#card-grad-light)" stroke="#E2E8F0" stroke-width="1"/>
      <text x="314" y="316" font-family="monospace" font-size="10" fill="#64748B">Team</text>
      <text x="574" y="316" text-anchor="end" font-family="monospace" font-size="11" font-weight="bold" fill="#0284C7">Team 404</text>

      <!-- Row 8: Location & Contact -->
      <rect x="0" y="338" width="288" height="42" rx="6" fill="url(#card-grad-light)" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="364" font-family="monospace" font-size="10" fill="#64748B">Origin</text>
      <text x="274" y="364" text-anchor="end" font-family="monospace" font-size="11" fill="#0F172A">Coimbatore, Tamil Nadu</text>

      <rect x="300" y="338" width="288" height="42" rx="6" fill="url(#card-grad-light)" stroke="#E2E8F0" stroke-width="1"/>
      <text x="314" y="364" font-family="monospace" font-size="10" fill="#64748B">GitHub</text>
      <text x="574" y="364" text-anchor="end" font-family="monospace" font-size="11" font-weight="bold" fill="#0891B2">@ponmudimr</text>

    </g>

    <!-- Bottom Status Bar -->
    <rect x="24" y="518" width="588" height="32" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="40" y="538" font-family="monospace" font-size="10" fill="#64748B">STATUS:</text>
    <text x="95" y="538" font-family="monospace" font-size="10" font-weight="bold" fill="#16A34A">PROTOTYPING &amp; SHIPPING SAR SYSTEMS</text>
    <text x="596" y="538" text-anchor="end" font-family="monospace" font-size="10" fill="#64748B">mrponmudi747@gmail.com</text>

  </g>

  <!-- Full Board Subtle Laser Scanline -->
  <line x1="0" y1="0" x2="1180" y2="0" stroke="#0891B2" stroke-width="1.5" opacity="0.15">
    <animate attributeName="y1" values="42;660;42" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="42;660;42" dur="8s" repeatCount="indefinite"/>
  </line>
</svg>